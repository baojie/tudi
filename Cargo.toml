[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
rustix = { version = "1.1.6", features = ["fs", "event", "time"] }
rayon = "1.12.0"
proptest = "1.12.0"
criterion = "0.8.2"
tempfile = "3.27.0"
async-channel = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
