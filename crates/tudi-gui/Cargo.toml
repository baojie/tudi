[package]
name = "tudi-gui"
description = "tudi: a fast, tree-first file browser for Linux"
default-run = "tudi-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The GUI. Normally started by `tudi`.
[[bin]]
name = "tudi-gui"
path = "src/main.rs"

# GIO-only launcher that forwards to a running instance (P2).
[[bin]]
name = "tudi"
path = "src/bin/tudi.rs"

[lints]
workspace = true

[dependencies]
adw.workspace = true
anyhow.workspace = true
async-channel.workspace = true
rustix.workspace = true
gettext-rs.workspace = true
gio.workspace = true
glib.workspace = true
gtk.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tudi-core = { path = "../tudi-core" }
