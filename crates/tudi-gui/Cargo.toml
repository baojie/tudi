[package]
name = "tudi-gui"
description = "tudi: a fast, tree-first file browser for Linux"
default-run = "tudi-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The GUI. Normally started by `tudi`.
[[bin]]
name = "tudi-gui"
path = "src/main.rs"

# GIO-only launcher that forwards to a running instance (P2).
[[bin]]
name = "tudi"
path = "src/bin/tudi/main.rs"

[lints]
workspace = true

[dependencies]
adw.workspace = true
anyhow.workspace = true
async-channel.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
rustix.workspace = true
gettext-rs.workspace = true
gio.workspace = true
tudi-proto = { path = "../tudi-proto" }
glib.workspace = true
gtk.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tudi-core = { path = "../tudi-core" }
tudi-index = { path = "../tudi-index" }

# `.deb` package (scripts/package.sh passes --maintainer).
[package.metadata.deb]
name = "tudi"
section = "utils"
priority = "optional"
extended-description = """\
tudi is a fast, tree-first file browser for Linux (GTK4/libadwaita): a \
folder tree on the left, a details list on the right, live updates, and \
a history of the folders you open most."""
depends = "$auto"
assets = [
    ["target/release/tudi", "usr/bin/", "755"],
    ["target/release/tudi-gui", "usr/bin/", "755"],
    ["target/release/tudi-indexd", "usr/bin/", "755"],
    ["../../data/io.github.baojie.tudi.desktop", "usr/share/applications/", "644"],
    ["../../data/icons/hicolor/scalable/apps/io.github.baojie.tudi.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../target/locale-dist/zh_CN/LC_MESSAGES/tudi.mo", "usr/share/locale/zh_CN/LC_MESSAGES/", "644"],
    ["../../README.md", "usr/share/doc/tudi/", "644"],
    ["../../data/tudi-indexd.service", "usr/lib/systemd/user/", "644"],
]
