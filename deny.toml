# cargo-deny configuration. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode 1.x is unmaintained (not a vulnerability). Pulled in by
    # syntect (preview syntax highlighting, ADR-031), which only uses it to
    # decode the syntax and theme dumps compiled into the binary: no
    # untrusted input reaches it.
    { id = "RUSTSEC-2025-0141", reason = "syntect decodes only its own embedded dumps (ADR-031)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # nucleo-matcher (ADR-007): file-level copyleft, used unmodified.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
